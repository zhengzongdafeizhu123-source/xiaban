<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下班倒计时</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='white'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  #hourglass { width: auto; height: min(58svh, 600px); max-width: 76vw; object-fit: contain; }
  #stage[data-mode="hourglass"] #countdown { font-size: clamp(1.8rem, 5vw, 3rem); }
  #views { display: flex; gap: 16px; }
  #stage[data-mode="time"] #views { position: fixed; bottom: max(5svh, env(safe-area-inset-bottom)); }
  .view { position: relative; display: grid; place-items: center; width: 44px; height: 44px;
    border: 0; padding: 0; background: transparent; color: #666; cursor: pointer; }
  .view svg { width: 21px; height: 21px; }
  .view:hover, .view[aria-pressed="true"] { color: #fff; }
  .view[aria-pressed="true"]::after { content: ''; position: absolute; bottom: 0;
    width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  .view:focus-visible { outline: 1px solid #aaa; outline-offset: 2px; border-radius: 4px; }
  @media (max-height: 480px) { #hourglass { height: 48svh; } #stage { gap: 12px; } #views { bottom: 8px; } }
  #countdown {
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 16vw, 12rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #off-work {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  #install {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    display: none;
    background: #1a1a1a;
    color: #aaa;
    border: 1px solid #2e2e2e;
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #install:hover {
    color: #fff;
    border-color: #444;
  }
</style>
</head>
<body>
<main id="stage" data-mode="hourglass" hidden>
  <canvas id="hourglass" width="400" height="600" role="img" aria-label="上方为剩余上班时间，下方为已经过的上班时间"></canvas>
  <div id="countdown">00:00:00</div>
<nav id="views" aria-label="展示方式" hidden>
  <button class="view" id="time-view" type="button" aria-label="纯时间" aria-pressed="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </button>
  <button class="view" id="sand-view" type="button" aria-label="沙漏" aria-pressed="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg>
  </button>
</nav>
</main>
<img id="off-work" src="off-work.png" alt="拜拜了您嘞" hidden>
<button id="install" type="button" hidden>安装到桌面</button>
<script src="hourglass.js"></script>
<script src="countdown.js"></script>
<script>
  (function () {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    var installBtn = document.getElementById('install');
    var deferredPrompt = null;
    var standalone = window.matchMedia('(display-mode: standalone)').matches;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!standalone) {
        installBtn.hidden = false;
        installBtn.style.display = 'block';
      }
    });

    installBtn.addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        installBtn.hidden = true;
        installBtn.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function () {
      deferredPrompt = null;
      installBtn.hidden = true;
      installBtn.style.display = 'none';
    });
  })();
</script>
</body>
</html>
