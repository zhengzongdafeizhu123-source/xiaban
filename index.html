<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下班倒计时</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='white'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #countdown {
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 16vw, 12rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #off-work {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
  }
  #install {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    display: none;
    background: #1a1a1a;
    color: #aaa;
    border: 1px solid #2e2e2e;
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #install:hover {
    color: #fff;
    border-color: #444;
  }
</style>
</head>
<body>
<div id="countdown" hidden>00:00:00</div>
<img id="off-work" src="off-work.png" alt="拜拜了您嘞" hidden>
<button id="install" type="button" hidden>安装到桌面</button>
<script>
  (function () {
    var el = document.getElementById('countdown');
    var offWork = document.getElementById('off-work');
    var formatter = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      hour12: false,
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit'
    });

    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function tick() {
      var parts = {};
      formatter.formatToParts(new Date()).forEach(function (p) {
        if (p.type !== 'literal') parts[p.type] = p.value;
      });
      var hour = parseInt(parts.hour, 10) % 24;
      var minute = parseInt(parts.minute, 10);
      var second = parseInt(parts.second, 10);

      var working = hour >= 9 && hour < 18;
      el.hidden = !working;
      offWork.hidden = working;
      if (!working) return;

      var remaining = 18 * 3600 - (hour * 3600 + minute * 60 + second);

      var h = Math.floor(remaining / 3600);
      var m = Math.floor((remaining % 3600) / 60);
      var s = remaining % 60;
      el.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
    }

    function loop() {
      tick();
      setTimeout(loop, 1000 - (Date.now() % 1000));
    }

    loop();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }

    var installBtn = document.getElementById('install');
    var deferredPrompt = null;
    var standalone = window.matchMedia('(display-mode: standalone)').matches;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!standalone) {
        installBtn.hidden = false;
        installBtn.style.display = 'block';
      }
    });

    installBtn.addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        installBtn.hidden = true;
        installBtn.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function () {
      deferredPrompt = null;
      installBtn.hidden = true;
      installBtn.style.display = 'none';
    });
  })();
</script>
</body>
</html>
