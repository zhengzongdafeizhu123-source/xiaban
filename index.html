<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>下班倒计时</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="wardrobe.css?v=9">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='white'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  [hidden] { display: none !important; }
  #money-atmosphere { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: none; }
  body[data-money-look="gold"] #money-atmosphere { display: block; }
  #stage, #off-work, #next-work-countdown { position: relative; z-index: 1; }
  #pig-effects { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: visible; }
  #piggy.fx-ready #coin, #piggy.fx-ready #gain { display: none; }
  #piggy[data-look="gold"] #pig-art { animation: pearl-shine 2.7s ease-in-out infinite; }
  body[data-money-look="gold"] #earnings-total, body[data-money-look="gold"] .view[aria-pressed="true"] { color: #f4cc62; }
  .digit-6, .digit-8 { color: #e9ba55; }
  .digit-8 { animation: digit-twinkle 1.7s ease-in-out infinite; }
  @keyframes digit-twinkle { 0%,100% { text-shadow: 0 0 2px #b98124; } 45% { text-shadow: 0 0 5px #fff4bb, 0 0 12px #e7ad35; } }
  @keyframes pearl-shine { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.22); } }
  @media (prefers-reduced-motion: reduce) { .digit-8, #piggy #pig-art { animation: none !important; } }
  #stage { display: flex; flex-direction: column; align-items: center; gap: 30px; }
  #hourglass { width: auto; height: min(58svh, 600px); max-width: 76vw; object-fit: contain; }
  #stage[data-mode="hourglass"] #countdown { font-size: clamp(1.8rem, 5vw, 3rem); }
  #piggy { position: relative; width: min(820px, 94vw, 96svh); aspect-ratio: 4 / 3; }
  #pig-art { display: block; width: 100%; height: 100%; object-fit: contain;
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 0 49.724%, 18.163% 49.724%, 18.163% 36.832%, 0 36.832%); }
  #pig-tail { position: absolute; left: 10.014%; top: 36.832%; width: 8.149%; height: 12.892%;
    padding: 0; margin: 0; border: 0; background: #000; cursor: pointer; touch-action: manipulation; }
  #pig-tail img { display: block; width: 100%; height: 100%; transform-origin: right bottom; }
  #pig-tail:focus-visible { outline: 1px dashed #888; outline-offset: 6px; }
  #pig-tail::after { content: ''; position: absolute; inset: -8px; }
  #pig-tail.tugging img { animation: tail-tug .3s ease-out; }
  @keyframes tail-tug { 0%, 100% { transform: scaleX(1); } 40% { transform: scaleX(1.28) rotate(-3deg); } }
  #earnings-total { position: absolute; left: 52%; top: 50%; transform: translate(-50%, -50%);
    width: 58%; padding: 12px 0; border: 0; color: #fff; background: transparent; text-align: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  #earnings-value { display: block; font-size: clamp(25px, 6.5vw, 56px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #earnings-period-icon { display: block; height: 18px; margin-bottom: 12px; color: #777; }
  #earnings-period-icon svg { width: 17px; height: 17px; }
  #calendar-status { display: block; color: #888; font: 12px / 1.5 sans-serif; margin-top: 8px; }
  #coin { position: absolute; left: 47.1%; top: 1%; width: 7%; height: auto; color: white; opacity: 0; }
  #coin img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  #gain { position: absolute; top: 4%; left: 64%; color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
    font-size: clamp(13px, 3vw, 24px); font-weight: 400; line-height: 1; opacity: 0; white-space: nowrap; }
  #piggy.earning #coin { animation: coin-drop 1s linear infinite; }
  #piggy.earning #gain { animation: gain-rise 1s ease-out infinite; }
  @keyframes coin-drop { 0% { opacity: 0; transform: translateY(-5px); } 12% { opacity: 1; } 75% { opacity: 1; transform: translateY(var(--coin-travel, 70px)); } 88%, 100% { opacity: 0; transform: translateY(var(--coin-travel, 70px)) scale(.7); } }
  @keyframes gain-rise { 0% { opacity: 0; transform: translateY(8px); } 20%, 55% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }
  @media (prefers-reduced-motion: reduce) { #piggy.earning #coin { animation: none; opacity: 0; } #piggy.earning #gain { animation: none; opacity: 1; } #pig-tail.tugging img { animation: none; } }
  #views { display: flex; gap: 16px; }
  #stage[data-mode="time"] #views { position: fixed; bottom: max(5svh, env(safe-area-inset-bottom)); }
  .view { position: relative; display: grid; place-items: center; width: 44px; height: 44px;
    border: 0; padding: 0; background: transparent; color: #666; cursor: pointer; }
  .view svg { width: 21px; height: 21px; }
  .view:hover, .view[aria-pressed="true"] { color: #fff; }
  .view[aria-pressed="true"]::after { content: ''; position: absolute; bottom: 0;
    width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
  .view:focus-visible { outline: 1px solid #aaa; outline-offset: 2px; border-radius: 4px; }
  @media (max-height: 480px) { #hourglass { height: 48svh; } #stage { gap: 12px; } #views { bottom: 8px; } }
  #countdown, #next-work-countdown {
    color: #fff;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 16vw, 12rem);
    font-weight: 400;
    line-height: 1;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  #off-work {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
    cursor: pointer;
  }
  #off-work:focus-visible { outline: 1px solid #888; outline-offset: 4px; }
  #install {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    display: none;
    background: #1a1a1a;
    color: #aaa;
    border: 1px solid #2e2e2e;
    border-radius: 6px;
    padding: 0.5rem 0.9rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #install:hover {
    color: #fff;
    border-color: #444;
  }
</style>
</head>
<body>
<div id="skin-background" aria-hidden="true" hidden><img id="skin-background-art" alt=""></div>
<canvas id="money-atmosphere" aria-hidden="true"></canvas>
<main id="stage" data-mode="hourglass" hidden>
  <canvas id="hourglass" width="400" height="600" role="img" aria-label="上方为剩余上班时间，下方为已经过的上班时间"></canvas>
  <div id="countdown">00:00:00</div>
  <section id="piggy" data-look="normal" aria-label="收入存钱罐" hidden>
    <img id="pig-art" src="piggy-bank.png" alt="像素存钱罐">
    <button id="pig-tail" type="button" aria-label="当前显示今日累计，拉动猪尾巴切换本月累计"><img src="piggy-tail.png" alt=""></button>
    <canvas id="pig-effects" aria-hidden="true"></canvas>
    <span id="coin" aria-hidden="true"><img src="coin.png" alt=""></span>
    <span id="gain" aria-hidden="true">+¥0.0000</span>
    <output id="earnings-total" aria-label="可用余额" aria-live="off">
      <span id="earnings-period-icon" aria-hidden="true">
        <svg id="balance-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 7l2-3h12m4 7h-6v4h6"/></svg>
        <svg id="today-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
        <svg id="month-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h2M14 14h2M8 18h2M14 18h2"/></svg>
      </span>
      <span id="earnings-value">—</span>
      <span id="calendar-status" hidden></span>
    </output>
  </section>
<nav id="views" aria-label="展示方式" hidden>
  <button class="view" id="time-view" type="button" aria-label="纯时间" aria-pressed="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
  </button>
  <button class="view" id="sand-view" type="button" aria-label="沙漏" aria-pressed="true">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/></svg>
  </button>
  <button class="view" id="money-view" type="button" aria-label="存钱罐" aria-pressed="false">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 5c-1.5 0-2.8 1.4-3 2-1.3-.6-2.7-1-4-1-5 0-9 3-9 7 0 1.8.8 3.4 2.2 4.6L5 21h4l.7-2.1c1.5.3 3.1.3 4.6 0L15 21h4l-.2-3.4c.9-.8 1.6-1.8 2-2.9H23v-5h-2.2a7 7 0 0 0-1.6-2.3L19 5ZM2 9c-1 0-1 3 1 3M10 10h4"/><circle cx="17" cy="11" r=".5"/></svg>
  </button>
</nav>
</main>
<img id="off-work" src="off-work.png" alt="拜拜了您嘞" hidden>
<div id="next-work-countdown" role="timer" aria-label="距离下一个工作日早上九点" hidden></div>
<button id="install" type="button" hidden>安装到桌面</button>
<button id="skin-open" type="button" aria-haspopup="dialog" hidden>皮肤管理</button>
<dialog id="skin-window" aria-labelledby="skin-heading">
  <div class="skin-toolbar">
    <h2 id="skin-heading">皮肤管理</h2>
    <output id="skin-credit" aria-live="off">余额 —</output>
    <span id="skin-result-source" hidden></span>
    <button id="skin-close" type="button" aria-label="关闭皮肤管理">关闭</button>
  </div>
  <nav id="skin-nav" aria-label="皮肤管理导航"></nav>
  <p id="skin-message" role="status"></p>
  <section id="skin-screen" tabindex="-1" aria-labelledby="skin-heading"></section>
</dialog>
<script src="catalog.js?v=9"></script>
<script src="hourglass.js?v=9"></script>
<script src="work-calendar.js?v=9"></script>
<script src="earnings.js?v=9"></script>
<script src="digits.js?v=9"></script>
<script src="pig-effects.js?v=9"></script>
<script src="cdk-catalog.js?v=9"></script>
<script src="wallet-rules.js?v=9"></script>
<script src="wallet-client.js?v=9"></script>
<script src="wardrobe.js?v=9"></script>
<script src="skin-motion.js?v=9"></script>
<script src="countdown.js?v=9"></script>
<script>
  (function () {
    if ('serviceWorker' in navigator) {
      var versionedUrl = new URL(location.href);
      versionedUrl.searchParams.set('v', '9');
      if (location.href !== versionedUrl.href) history.replaceState(history.state, '', versionedUrl);
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (registration) {
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) registration.update().catch(function () {});
        });
      }).catch(function () {});
    }

    var installBtn = document.getElementById('install');
    var deferredPrompt = null;
    var standalone = window.matchMedia('(display-mode: standalone)').matches;

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      if (!standalone) {
        installBtn.hidden = false;
        installBtn.style.display = 'block';
      }
    });

    installBtn.addEventListener('click', function () {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function () {
        deferredPrompt = null;
        installBtn.hidden = true;
        installBtn.style.display = 'none';
      });
    });

    window.addEventListener('appinstalled', function () {
      deferredPrompt = null;
      installBtn.hidden = true;
      installBtn.style.display = 'none';
    });
  })();
</script>
</body>
</html>
